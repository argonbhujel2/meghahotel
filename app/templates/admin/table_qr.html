{% extends "admin/base.html" %}
{% block title %}QR – Table {{ table.table_number }}{% endblock %}
{% block page_title %}QR Code – Table {{ table.table_number }}{% endblock %}
{% block content %}
<div class="panel" style="max-width:420px;text-align:center">
  <p>Decorative table QR — print and place on the table</p>
  <img src="{{ url_for('admin.table_qr_png', table_id=table.id) }}" alt="QR" style="width:240px;height:240px;margin:1rem auto;border:1px solid #e8d5c4;border-radius:8px">
  <p style="font-size:0.85rem;word-break:break-all;color:#6B5344">{{ qr_url }}</p>
  <div style="display:flex;gap:0.5rem;justify-content:center;margin-top:1rem;flex-wrap:wrap">
    <a href="{{ url_for('admin.table_qr_png', table_id=table.id) }}" class="btn btn-primary btn-sm" download>Download PNG</a>
    <form method="post" action="{{ url_for('admin.regenerate_table_qr', table_id=table.id) }}" style="display:inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn btn-outline btn-sm" onclick="return confirm('Regenerate? Old QR will stop working.')">Regenerate</button>
    </form>
    <a href="{{ url_for('admin.tables_list') }}" class="btn btn-outline btn-sm">Back</a>
  </div>
</div>
{% endblock %}
