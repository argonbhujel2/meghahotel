{% extends "admin/base.html" %}
{% block title %}New Staff{% endblock %}
{% block page_title %}New Staff Account{% endblock %}
{% block content %}
<form method="post" class="panel" style="max-width:480px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group"><label>Full name</label><input type="text" name="full_name" required></div>
  <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
  <div class="form-group"><label>Password</label><input type="password" name="password" required minlength="8"></div>
  <div class="form-group"><label>Roles</label>
    {% for r in roles %}
    <label style="display:block;font-weight:400"><input type="checkbox" name="roles" value="{{ r.id }}"> {{ r.name }} – {{ r.description }}</label>
    {% endfor %}
  </div>
  <button type="submit" class="btn btn-primary">Create</button>
  <a href="{{ url_for('admin.staff_list') }}" class="btn btn-outline">Cancel</a>
</form>
{% endblock %}
