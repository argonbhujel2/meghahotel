{% extends "public/base.html" %}
{% block title %}{{ item.name }} | Menu{% endblock %}
{% block content %}
<section class="section">
  <div class="container" style="max-width:640px">
    <img src="{{ dish_img(item) }}" alt="{{ item.name }}" style="width:100%;max-height:280px;object-fit:cover;border-radius:12px;margin-bottom:1rem" onerror="this.onerror=null;this.src='{{ DEFAULT_DISH }}'">
    <h2>{{ item.name }}</h2>
    <p>{{ item.description or item.short_description }}</p>
    <p class="price" style="margin:1rem 0">Rs. {{ '%.2f'|format(item.effective_price_paisa / 100) }}</p>
    <button class="btn btn-primary" data-add-to-cart
      data-item-id="{{ item.id }}" data-item-name="{{ item.name }}"
      data-item-price="{{ item.effective_price_paisa }}">Add to Cart</button>
  </div>
</section>
{% endblock %}
